<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — VDS Reseller Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
<form method="post" action="/login" class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-1">⚡ VDS Reseller</h1>
    <p class="text-slate-500 text-sm mb-6">Панель администратора</p>
    {% if error %}
    <div class="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{{ error }}</div>
    {% endif %}
    <label class="block text-sm font-medium mb-1">Пароль</label>
    <input type="password" name="password" required autofocus
           class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg py-2.5">
        Войти
    </button>
</form>
</body>
</html>
