{% extends "base.html" %}
{% block title %}Пользователи — VDS Reseller{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Пользователи</h1>
    <input type="search" name="q" value="{{ q }}" placeholder="Поиск: ID, @username, имя..."
           hx-get="/users/" hx-trigger="input changed delay:400ms" hx-target="#users-table"
           class="border border-slate-300 rounded-lg px-3 py-2 w-80 focus:outline-none focus:ring-2 focus:ring-indigo-500">
</div>
<div id="users-table">
    {% include "partials/users_table.html" %}
</div>
{% endblock %}
