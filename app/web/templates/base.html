<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VDS Reseller — Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
<nav class="bg-slate-900 text-white">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-14">
        <div class="flex items-center gap-6">
            <span class="font-bold text-lg">⚡ VDS Reseller</span>
            {% set nav = [("dashboard", "/", "Дашборд"), ("users", "/users/", "Пользователи"),
                          ("orders", "/orders/", "Заказы"), ("servers", "/servers/", "Серверы")] %}
            {% for key, url, label in nav %}
            <a href="{{ url }}"
               class="px-3 py-1.5 rounded-md text-sm {% if active_page == key %}bg-slate-700 font-semibold{% else %}hover:bg-slate-800 text-slate-300{% endif %}">
                {{ label }}
            </a>
            {% endfor %}
        </div>
        <form method="post" action="/logout">
            <button class="text-sm text-slate-400 hover:text-white">Выйти →</button>
        </form>
    </div>
</nav>
<main class="max-w-7xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
</main>
</body>
</html>
