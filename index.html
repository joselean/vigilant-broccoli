  <style>

  <script type="text/babel" data-presets="react">
    // Suppress benign Framer Motion dev warnings about list keys.
    const __origConsoleError = console.error;
    console.error = (...args) => {

    const GlobeIcon = () => (

        <path d="M2 12h20" />
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
      </svg>
    );

    /* ---------- FadingVideo (rAF crossfade, no CSS transitions) ---------- */

    const FADE_MS = 500;
    const FADE_OUT_LEAD = 0.55;

    function FadingVideo({ src, className, style }) {
      const videoRef = useRef(null);
      const rafRef = useRef(null);
      const fadingOutRef = useRef(false);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const fadeTo = (target, duration) => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          const from = parseFloat(video.style.opacity || "0");
          const start = performance.now();
          const step = (now) => {
            const t = Math.min((now - start) / duration, 1);
            video.style.opacity = String(from + (target - from) * t);
            if (t < 1) rafRef.current = requestAnimationFrame(step);
          };
          rafRef.current = requestAnimationFrame(step);
        };

        const onLoadedData = () => {
          video.style.opacity = "0";
          video.play();
          fadeTo(1, FADE_MS);
        };

        const onTimeUpdate = () => {
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const onEnded = () => {
          video.style.opacity = "0";
          setTimeout(() => {
            video.currentTime = 0;
            video.play();
            fadingOutRef.current = false;
            fadeTo(1, FADE_MS);
          }, 100);
        };

        video.addEventListener("loadeddata", onLoadedData);
        video.addEventListener("timeupdate", onTimeUpdate);
        video.addEventListener("ended", onEnded);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          video.removeEventListener("loadeddata", onLoadedData);
          video.removeEventListener("timeupdate", onTimeUpdate);
          video.removeEventListener("ended", onEnded);
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          src={src}
          className={className}
          style={{ opacity: 0, ...style }}
          autoPlay
          muted
          playsInline
          preload="auto"
        />
      );
    }
    window.FadingVideo = FadingVideo;

    /* ---------- BlurText (word-by-word blur-in) ---------- */

    function BlurText({ text, className }) {
      const ref = useRef(null);
      const [inView, setInView] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
              observer.disconnect();
            }
          },
          { threshold: 0.1 }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      const words = text.split(" ");

      return (
        <p
          ref={ref}
          className={className}
          style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={
                inView
                  ? {
                      filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                      opacity: [0, 0.5, 1],
                      y: [50, -5, 0],
                    }
                  : {}
              }
              transition={{
                duration: 0.7,
                times: [0, 0.5, 1],
                ease: "easeOut",
                delay: (i * 100) / 1000,
              }}
              style={{ display: "inline-block", marginRight: "0.28em" }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }
    window.BlurText = BlurText;

    /* ---------- Navbar ---------- */

    window.Navbar = Navbar;

    /* ---------- Hero ---------- */

    function Hero() {

          <div className="relative z-10 flex flex-col h-full">

              <div className="mt-6">

              <motion.p

                Experience the internet the way it was meant to be. Our hardened

              </motion.p>

              <motion.div {...heroEntrance(1.1)} className="flex items-center gap-6 mt-6">

              </motion.div>

              <motion.div {...heroEntrance(1.3)} className="flex items-stretch gap-4 mt-8">

                  <ClockIcon />
                  <div className="mt-auto pt-6">
                    <div className="font-heading italic text-white text-4xl tracking-[-1px] leading-none">
                      34.5 Ms
                    </div>
                    <div className="text-xs text-white font-body font-light mt-2">
                      Average Connection Latency
                    </div>
                  </div>
                </div>
                <div className="liquid-glass p-5 w-[220px] rounded-[1.25rem] flex flex-col items-start text-left">
                  <GlobeIcon />
                  <div className="mt-auto pt-6">
                    <div className="font-heading italic text-white text-4xl tracking-[-1px] leading-none">
                      94+
                    </div>
                    <div className="text-xs text-white font-body font-light mt-2">
                      Countries Across the Globe
                    </div>
                  </div>
                </div>
              </motion.div>
            </div>

            <motion.div {...heroEntrance(1.4)} className="flex flex-col items-center gap-4 pb-8">
              <div className="liquid-glass rounded-full px-3.5 py-1 text-xs font-medium text-white font-body">
                Trusted by leading security pioneers globally
              </div>
              <div className="flex items-center gap-12 md:gap-16">
                {["Aeon", "Vela", "Apex", "Orbit", "Zeno"].map((name) => (
                  <span key={name} className="font-heading italic text-white text-2xl md:text-3xl tracking-tight">
                    {name}
                  </span>
                ))}
              </div>
            </motion.div>
          </div>
        </section>
      );
    }
    window.Hero = Hero;

    /* ---------- Capabilities ---------- */

    const CAPABILITY_CARDS = [

        tags: ["10-Gbit Servers", "94 Countries", "Smart Location", "Zero Throttle"],
        body:
          "Connect to thousands of servers in seconds. One tap picks the fastest route for streaming, gaming and work.",
      },
      {

          "M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1Zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7Z",

    function Capabilities() {
      return (

          <div className="relative z-10 px-8 md:px-16 lg:px-20 pt-24 pb-10 flex flex-col min-h-screen">
            <div className="mb-auto">
              <div className="text-sm font-body text-white/80 mb-6">// Capabilities</div>
              <h2 className="font-heading italic text-white text-6xl md:text-7xl lg:text-[6rem] leading-[0.9] tracking-[-3px]">
                Privacy

            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16">
              {CAPABILITY_CARDS.map((card) => (
                <div
                  key={card.title}

                      </svg>
                    </div>
                    <div className="flex flex-wrap justify-end gap-1.5 max-w-[70%]">
                      {card.tags.map((tag) => (
                        <span

                  <div className="flex-1" />

                  <div className="mt-6">

    /* ---------- App ---------- */

    function App() {

    window.App = App;

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
